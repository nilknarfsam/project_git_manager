[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-git-core"
version = "0.1.0"
description = "Core Git logic for Project Git Manager"
authors = [{ name = "Franklin" }]
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["project_git_core*"]
